server:
  port: ${MCP_SERVER_PORT:8090}
spring:
  application:
    name: hr-mcp-server
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/hr_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:hr_agent}
    password: ${MYSQL_PASSWORD:hr_agent}
  ai:
    mcp:
      server:
        name: hr-readonly-tools
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
