spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration
  datasource:
    url: jdbc:h2:mem:hr_agent_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration/common
logging:
  level:
    root: WARN
    com.lnxx.hr: INFO
hr-agent:
  runtime: python
spring.ai.openai.api-key: test-key
